version: '3'

networks:
  whaticket:

services:

  backend:
    stop_grace_period: 60s
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    environment:
      - DB_HOST=mysql
      - DB_USER=root
      - DB_PASS=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - DB_NAME=${MYSQL_DATABASE:-whaticket}
      - JWT_SECRET=${JWT_SECRET:-3123123213123}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-75756756756}
      - BACKEND_URL=${BACKEND_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - PROXY_PORT=${PROXY_PORT:-8080}
      - CHROME_ARGS=--no-sandbox --disable-setuid-sandbox
      - WHISPER_ASR_URL=${WHISPER_ASR_URL:-http://whisper-asr:9000}
      - PIPER_TTS_URL=${PIPER_TTS_URL:-http://piper-tts:5000}
      - PIPER_VOICE=${PIPER_VOICE:-pt_BR-faber-medium}
      - KOKORO_TTS_URL=${KOKORO_TTS_URL:-http://kokoro-tts:8880}
      - KOKORO_VOICE=${KOKORO_VOICE:-pf_dora}
      - LOCAL_LLM_KEEP_ALIVE=${LOCAL_LLM_KEEP_ALIVE:-30m}
    ports:
      - ${BACKEND_PORT:-8080}:3000
    volumes:
      - ./backend/public/:/usr/src/app/public/
      - ./backend/.wwebjs_auth/:/usr/src/app/.wwebjs_auth/
      - ./backend/.zapo_auth/:/usr/src/app/.zapo_auth/
    networks:
      - whaticket
    depends_on:
      - whisper-asr
      - piper-tts

  frontend:
    ports:
      - ${FRONTEND_PORT:-3000}:80
      - ${FRONTEND_SSL_PORT:-3001}:443
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    environment:
      - URL_BACKEND=backend:3000
      - VITE_BACKEND_URL=${BACKEND_URL:-http://localhost}:${PROXY_PORT:-8080}/
      - FRONTEND_SERVER_NAME=${FRONTEND_SERVER_NAME}
      - BACKEND_SERVER_NAME=${BACKEND_SERVER_NAME}
    volumes:
      - ./ssl/certs/:/etc/nginx/ssl/
      - ./ssl/www/:/var/www/letsencrypt/
    networks:
      - whaticket

  whisper-asr:
    image: onerahmet/openai-whisper-asr-webservice:latest
    environment:
      - ASR_ENGINE=faster_whisper
      - ASR_MODEL=${WHISPER_MODEL:-small}
    ports:
      - ${WHISPER_PORT:-9000}:9000
    volumes:
      - ./.docker/whisper-cache/:/root/.cache
    networks:
      - whaticket

  piper-tts:
    image: kamilkrawiec/piper-openai-tts:latest
    volumes:
      - ./.docker/piper-data/:/data
    ports:
      - ${PIPER_PORT:-5500}:5000
    networks:
      - whaticket

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    ports:
      - ${KOKORO_PORT:-8880}:8880
    restart: unless-stopped
    networks:
      - whaticket

  mysql:
    image: ${MYSQL_ENGINE:-mariadb}:${MYSQL_VERSION:-10.6}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_bin    
    volumes:
      - ./.docker/data/:/var/lib/mysql
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-whaticket}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-strongpassword}
      - TZ=${TZ:-America/Fortaleza}
    ports:
      - ${MYSQL_PORT:-3306}:3306
    restart: always
    networks:
      - whaticket